<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-label="One rank under Interleaved1F1B: the store's lifecycle per micro-batch and where deposits are collected">
<style>
  text{font-family:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;fill:#0e1626}
  .t{font-size:11.5px}.s{font-size:10px;fill:#4b5a70}.b{font-size:12.5px;font-weight:700}.h{font-size:13px;font-weight:700}
</style>
<rect width="1080" height="560" fill="#ffffff"/>
<defs>
  <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#2547d0"/></marker>
  <marker id="am" markerWidth="10" markerHeight="10" refX="8" refY="3.4" orient="auto"><path d="M0,0 L8,3.4 L0,6.8 Z" fill="#a81e7a"/></marker>
  <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#0f7b5f"/></marker>
</defs>
<text class="h" x="20" y="24">One rank R under Interleaved1F1B: virtual stages v0 = S_R and v1 = S_R+P, micro-batches mb0 and mb1</text>
<text class="s" x="20" y="42">Time runs left to right. The rank's RankStore is shared by v0 and v1; every entry is keyed by (micro-batch, block).</text>

<!-- timeline axis -->
<line x1="20" y1="70" x2="1060" y2="70" stroke="#4b5a70"/>
<text class="s" x="1000" y="64">time</text>

<!-- schedule row -->
<text class="b" x="20" y="100">schedule</text>
<g>
  <rect x="110" y="84" width="110" height="26" fill="#eef1f8" stroke="#2547d0"/><text class="t" x="118" y="101">F v0 mb0</text>
  <rect x="230" y="84" width="110" height="26" fill="#eef1f8" stroke="#2547d0"/><text class="t" x="238" y="101">F v0 mb1</text>
  <rect x="350" y="84" width="110" height="26" fill="#eef1f8" stroke="#2547d0"/><text class="t" x="358" y="101">F v1 mb0</text>
  <rect x="470" y="84" width="110" height="26" fill="#eef1f8" stroke="#2547d0"/><text class="t" x="478" y="101">F v1 mb1</text>
  <rect x="610" y="84" width="110" height="26" fill="#fbeff6" stroke="#a81e7a"/><text class="t" x="618" y="101">B v1 mb0</text>
  <rect x="730" y="84" width="110" height="26" fill="#fbeff6" stroke="#a81e7a"/><text class="t" x="738" y="101">B v1 mb1</text>
  <rect x="850" y="84" width="110" height="26" fill="#fbeff6" stroke="#a81e7a"/><text class="t" x="858" y="101">B v0 mb0</text>
  <rect x="970" y="84" width="90" height="26" fill="#fbeff6" stroke="#a81e7a"/><text class="t" x="978" y="101">B v0 mb1</text>
</g>
<text class="s" x="110" y="128">(steady state interleaves forwards and backwards; what matters below is the order the schedule guarantees on a rank: B v1 mb before B v0 mb)</text>

<!-- store row -->
<text class="b" x="20" y="170">RankStore</text>
<text class="s" x="20" y="186">(mb0 shown)</text>
<g>
  <rect x="110" y="150" width="110" height="46" fill="#fff" stroke="#0f7b5f"/>
  <text class="s" x="116" y="166">put(mb0, own</text><text class="s" x="116" y="180">commits + received)</text>
  <rect x="350" y="150" width="112" height="46" fill="#fff" stroke="#0f7b5f"/>
  <text class="s" x="356" y="166">read(mb0): assemble</text><text class="s" x="356" y="180">the stack + delta</text>
  <rect x="472" y="150" width="112" height="46" fill="#fff" stroke="#9a6100"/>
  <text class="s" x="478" y="166">release(mb0) after</text><text class="s" x="478" y="180">last stage fwd on rank</text>
  <path d="M220,173 L350,173" stroke="#0f7b5f" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
  <text class="s" x="240" y="168">held across v0 -> v1</text>
</g>
<text class="s" x="110" y="214">the store holds VALUES (blocks), not graphs: a stage's activations live only in its own forward graph, traversed once per mb</text>

<!-- deposits row -->
<text class="b" x="20" y="262">deposits</text>
<text class="s" x="20" y="278">(gradients of</text><text class="s" x="20" y="292">stored columns)</text>
<g>
  <rect x="610" y="244" width="110" height="52" fill="#fff" stroke="#a81e7a"/>
  <text class="s" x="616" y="260">backward_one_chunk:</text><text class="s" x="616" y="274">grad of stored cols</text><text class="s" x="616" y="288">-> deposit(mb0, b)</text>
  <rect x="836" y="244" width="224" height="52" fill="#fff" stroke="#a81e7a"/>
  <text class="s" x="842" y="260">_retrieve_recv_grads, before own bwd:</text><text class="s" x="842" y="274">wire grad + collect(mb0, b) deposits;</text><text class="s" x="842" y="288">count == deposits_expected(b, S)</text>
  <path d="M720,270 L836,270" stroke="#a81e7a" stroke-width="1.4" fill="none" marker-end="url(#am)"/>
  <text class="s" x="730" y="264">slot, no collective</text>
</g>

<!-- wire row -->
<text class="b" x="20" y="340">wire (P2P)</text>
<g>
  <text class="s" x="110" y="332">fwd: (hidden, delta) to the next stage, delta = blocks the receiving rank lacks</text>
  <path d="M110,348 L580,348" stroke="#2547d0" stroke-width="1.4" fill="none" marker-end="url(#ab)"/>
  <text class="s" x="600" y="332">bwd: the delta's gradient returns as a stage-input gradient (schedule SEND_B / RECV_B)</text>
  <path d="M1050,348 L600,348" stroke="#a81e7a" stroke-width="1.4" fill="none" marker-end="url(#am)"/>
</g>

<!-- rules -->
<rect x="20" y="380" width="1040" height="165" rx="6" fill="#ffffff" stroke="#4b5a70" stroke-dasharray="4,3"/>
<text class="b" x="32" y="402">What the timeline fixes, and what it needs</text>
<text class="t" x="32" y="424">1. micro-batch key: the store is per mb, so forward and backward must know the mb -- the schedule's chunk id (fwd_chunk_id / bwd_chunk_id), never id(tensor)</text>
<text class="t" x="32" y="442">2. release: only after the rank's LAST virtual stage forward for that mb (v1 reads what v0 kept); dropping at v0's backward would lose v1's read</text>
<text class="t" x="32" y="460">3. two gradient routes for one block: across ranks the delta's gradient rides the schedule's backward P2P; on a rank the stored column's</text>
<text class="t" x="32" y="478">   gradient is a deposit that the stage which brought the block onto the rank collects before its own backward -- ordered by the schedule itself</text>
<text class="t" x="32" y="496">4. counts: deposits_expected(b, S) is a static function of the routing tables; a missing deposit raises instead of training quietly</text>
<text class="t" x="32" y="514">5. constraints: micro-batches >= virtual stages; virtual stages divisible by P; PP exact at one mb, a bf16 accumulation-order margin at many, VP adds nothing</text>
<text class="s" x="32" y="534">Subclass version (pipeline_stage.py): no tensor hook, no autograd Function, no detach trick -- the store, the deposits and the schedule order are the whole mechanism.</text>
</svg>
