<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" viewBox="0 0 1185 462" role="img" aria-label="Forward-only example: three ranks with two virtual stages each in loop placement, the blocks each rank holds at every stage and the blocks every hop carries">
    <defs>
      <marker id="xmf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
      </marker>
    </defs>
    <text x="20" y="26" class="title" fill="#1f2328" font-size="16" font-weight="600">Example: forward only</text>
    <text x="200" y="26" class="sub" fill="#5f6b76">3 ranks, 2 virtual stages each, loop placement (stage s on rank s mod 3); stage s opens block b<tspan dy="3" font-size="10">s</tspan></text>
    <text x="200" y="46" class="sub" fill="#5f6b76">cache: the blocks the rank holds when the stage starts; Δ: the blocks a hop carries besides h</text>
    <rect x="16" y="60" width="1160" height="90" rx="8" class="band" fill="#f3f1ec"/>
    <text x="28" y="110" class="t" fill="#1f2328" font-size="14" font-weight="600">rank 0</text>
    <rect x="16" y="170" width="1160" height="90" rx="8" class="band" fill="#f3f1ec"/>
    <text x="28" y="220" class="t" fill="#1f2328" font-size="14" font-weight="600">rank 1</text>
    <rect x="16" y="280" width="1160" height="90" rx="8" class="band" fill="#f3f1ec"/>
    <text x="28" y="330" class="t" fill="#1f2328" font-size="14" font-weight="600">rank 2</text>
    <rect x="110" y="70" width="142" height="70" rx="8" class="ent" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
    <text x="181" y="92" text-anchor="middle" class="t" fill="#1f2328" font-size="14" font-weight="600">stage 0</text>
    <text x="181" y="112" text-anchor="middle" class="sym" fill="#1f2328" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">cache: empty</text>
    <text x="181" y="131" text-anchor="middle" class="sym" fill="#1f2328" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">commit b0</text>
    <rect x="295" y="180" width="142" height="70" rx="8" class="ent" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
    <text x="366" y="202" text-anchor="middle" class="t" fill="#1f2328" font-size="14" font-weight="600">stage 1</text>
    <text x="366" y="222" text-anchor="middle" class="sym" fill="#1f2328" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">cache: empty</text>
    <text x="366" y="241" text-anchor="middle" class="sym" fill="#1f2328" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">commit b1</text>
    <rect x="480" y="290" width="142" height="70" rx="8" class="ent" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
    <text x="551" y="312" text-anchor="middle" class="t" fill="#1f2328" font-size="14" font-weight="600">stage 2</text>
    <text x="551" y="332" text-anchor="middle" class="sym" fill="#1f2328" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">cache: empty</text>
    <text x="551" y="351" text-anchor="middle" class="sym" fill="#1f2328" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">commit b2</text>
    <rect x="665" y="70" width="142" height="70" rx="8" class="ent" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
    <text x="736" y="92" text-anchor="middle" class="t" fill="#1f2328" font-size="14" font-weight="600">stage 3</text>
    <text x="736" y="112" text-anchor="middle" class="sym" fill="#1f2328" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">cache: b0</text>
    <text x="736" y="131" text-anchor="middle" class="sym" fill="#1f2328" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">commit b3</text>
    <rect x="850" y="180" width="142" height="70" rx="8" class="ent" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
    <text x="921" y="202" text-anchor="middle" class="t" fill="#1f2328" font-size="14" font-weight="600">stage 4</text>
    <text x="921" y="222" text-anchor="middle" class="sym" fill="#1f2328" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">cache: b0 b1</text>
    <text x="921" y="241" text-anchor="middle" class="sym" fill="#1f2328" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">commit b4</text>
    <rect x="1035" y="290" width="142" height="70" rx="8" class="ent" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
    <text x="1106" y="312" text-anchor="middle" class="t" fill="#1f2328" font-size="14" font-weight="600">stage 5</text>
    <text x="1106" y="332" text-anchor="middle" class="sym" fill="#1f2328" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">cache: b0 b1 b2</text>
    <text x="1106" y="351" text-anchor="middle" class="sym" fill="#1f2328" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">commit b5</text>
    <polyline points="215,140 215,215 294,215" class="fwd" fill="none" stroke="#1f2328" stroke-width="1.8" marker-end="url(#xmf)"/>
    <text x="221" y="208" class="lf" fill="#d9760a" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">Δ: b0</text>
    <polyline points="400,250 400,325 479,325" class="fwd" fill="none" stroke="#1f2328" stroke-width="1.8" marker-end="url(#xmf)"/>
    <text x="406" y="318" class="lf" fill="#d9760a" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">Δ: b0 b1</text>
    <polyline points="585,290 585,105 664,105" class="fwd" fill="none" stroke="#1f2328" stroke-width="1.8" marker-end="url(#xmf)"/>
    <text x="591" y="98" class="lf" fill="#d9760a" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">Δ: b1 b2</text>
    <polyline points="770,140 770,215 849,215" class="fwd" fill="none" stroke="#1f2328" stroke-width="1.8" marker-end="url(#xmf)"/>
    <text x="776" y="208" class="lf" fill="#d9760a" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">Δ: b2 b3</text>
    <polyline points="955,250 955,325 1034,325" class="fwd" fill="none" stroke="#1f2328" stroke-width="1.8" marker-end="url(#xmf)"/>
    <text x="961" y="318" class="lf" fill="#d9760a" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">Δ: b3 b4</text>
    <text x="1035" y="378" class="note" fill="#1f6fb2" font-size="12">aggregation over b0 … b5</text>
    <text x="20" y="404" class="sub" fill="#5f6b76">hop</text>
    <text x="20" y="426" class="lf" fill="#d9760a" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">cache on</text>
    <text x="20" y="448" class="off" fill="#5f6b76" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace">cache off</text>
    <text x="255" y="404" text-anchor="middle" class="sub" fill="#5f6b76">stage 0 → 1</text>
    <text x="255" y="426" text-anchor="middle" class="lf" fill="#d9760a" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">b0</text>
    <text x="255" y="448" text-anchor="middle" class="off" fill="#5f6b76" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace">b0</text>
    <text x="440" y="404" text-anchor="middle" class="sub" fill="#5f6b76">stage 1 → 2</text>
    <text x="440" y="426" text-anchor="middle" class="lf" fill="#d9760a" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">b0 b1</text>
    <text x="440" y="448" text-anchor="middle" class="off" fill="#5f6b76" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace">b0 b1</text>
    <text x="625" y="404" text-anchor="middle" class="sub" fill="#5f6b76">stage 2 → 3</text>
    <text x="625" y="426" text-anchor="middle" class="lf" fill="#d9760a" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">b1 b2</text>
    <text x="625" y="448" text-anchor="middle" class="off" fill="#5f6b76" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace">b0 b1 b2</text>
    <text x="810" y="404" text-anchor="middle" class="sub" fill="#5f6b76">stage 3 → 4</text>
    <text x="810" y="426" text-anchor="middle" class="lf" fill="#d9760a" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">b2 b3</text>
    <text x="810" y="448" text-anchor="middle" class="off" fill="#5f6b76" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace">b0 b1 b2 b3</text>
    <text x="995" y="404" text-anchor="middle" class="sub" fill="#5f6b76">stage 4 → 5</text>
    <text x="995" y="426" text-anchor="middle" class="lf" fill="#d9760a" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14">b3 b4</text>
    <text x="995" y="448" text-anchor="middle" class="off" fill="#5f6b76" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace">b0 b1 b2 b3 b4</text>
  </svg>
