<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="12" viewBox="0 0 1480 700" role="img" aria-label="Forward and backward data flow of one Kimi K3 pipeline stage with the block cache on, next to the same stage with the cache off">
    <defs>
      <marker id="mf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
      </marker>
      <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#d92d20"/>
      </marker>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="6" height="6" fill="#eef9f0"/>
        <line x1="0" y1="0" x2="0" y2="6" stroke="#2f9e44" stroke-width="1.2"/>
      </pattern>
    </defs>

    <!-- ===================== cache on ===================== -->
    <text x="20" y="30" class="title" fill="#1f2328" font-size="15" font-weight="600">attn_res_cache on</text>
    <text x="170" y="30" class="sub" fill="#5f6b76">stage s on rank r</text>

    <text x="365" y="72" text-anchor="middle" class="lf" fill="#d9760a" font-family="IBM Plex Mono, Consolas, monospace">h, Δ  from stage s−1</text>
    <text x="365" y="604" text-anchor="middle" class="lf" fill="#d9760a" font-family="IBM Plex Mono, Consolas, monospace">h′, Δ′  to stage s+1</text>
    <text x="685" y="72" text-anchor="middle" class="lb" fill="#d92d20" font-family="IBM Plex Mono, Consolas, monospace">∇h, ∇Δ  to stage s−1</text>
    <text x="685" y="604" text-anchor="middle" class="lb" fill="#d92d20" font-family="IBM Plex Mono, Consolas, monospace">∇h′, ∇Δ′  from stage s+1</text>

    <!-- forward column -->
    <rect x="250" y="90" width="230" height="40" rx="8" class="comm" fill="#c6efce" stroke="#2f9e44" stroke-width="1.4"/>
    <text x="365" y="115" text-anchor="middle" class="t" fill="#1f2328" font-size="13" font-weight="600">P2P recv</text>

    <rect x="250" y="190" width="230" height="50" rx="8" class="ent" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
    <text x="365" y="211" text-anchor="middle" class="t" fill="#1f2328" font-size="13" font-weight="600">assemble</text>
    <text x="365" y="229" text-anchor="middle" class="sym" fill="#1f2328" font-family="IBM Plex Mono, Consolas, monospace">B = store ⊕ Δ  (leaf)</text>

    <rect x="250" y="300" width="230" height="60" rx="8" class="ent" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
    <text x="365" y="325" text-anchor="middle" class="t" fill="#1f2328" font-size="13" font-weight="600">layers l..m</text>
    <text x="365" y="345" text-anchor="middle" class="sym" fill="#1f2328" font-family="IBM Plex Mono, Consolas, monospace">block start: B ⊕= h</text>

    <rect x="250" y="420" width="230" height="50" rx="8" class="ent" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
    <text x="365" y="441" text-anchor="middle" class="t" fill="#1f2328" font-size="13" font-weight="600">pack Δ′</text>
    <text x="365" y="459" text-anchor="middle" class="sym" fill="#1f2328" font-family="IBM Plex Mono, Consolas, monospace">what the next rank lacks</text>

    <rect x="250" y="530" width="230" height="40" rx="8" class="comm" fill="#c6efce" stroke="#2f9e44" stroke-width="1.4"/>
    <text x="365" y="555" text-anchor="middle" class="t" fill="#1f2328" font-size="13" font-weight="600">P2P send</text>

    <text x="250" y="684" class="cap f" fill="#d9760a" font-size="12.5" font-weight="600" letter-spacing="0.08em">FORWARD</text>

    <line x1="365" y1="130" x2="365" y2="188" class="fwd" fill="none" stroke="#1f2328" stroke-width="1.8" marker-end="url(#mf)"/>
    <text x="373" y="182" class="lf" fill="#d9760a" font-family="IBM Plex Mono, Consolas, monospace">h, Δ</text>
    <line x1="365" y1="240" x2="365" y2="298" class="fwd" fill="none" stroke="#1f2328" stroke-width="1.8" marker-end="url(#mf)"/>
    <text x="373" y="274" class="lf" fill="#d9760a" font-family="IBM Plex Mono, Consolas, monospace">h, B</text>
    <line x1="365" y1="360" x2="365" y2="418" class="fwd" fill="none" stroke="#1f2328" stroke-width="1.8" marker-end="url(#mf)"/>
    <text x="373" y="394" class="lf" fill="#d9760a" font-family="IBM Plex Mono, Consolas, monospace">h′, B′</text>
    <line x1="365" y1="470" x2="365" y2="528" class="fwd" fill="none" stroke="#1f2328" stroke-width="1.8" marker-end="url(#mf)"/>
    <text x="373" y="522" class="lf" fill="#d9760a" font-family="IBM Plex Mono, Consolas, monospace">h′, Δ′</text>

    <!-- rank store -->
    <rect x="20" y="190" width="170" height="140" rx="8" class="ent" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
    <text x="105" y="214" text-anchor="middle" class="t" fill="#1f2328" font-size="13" font-weight="600">rank store</text>
    <text x="105" y="240" text-anchor="middle" class="sym" fill="#1f2328" font-family="IBM Plex Mono, Consolas, monospace">B ≤ s−P</text>
    <text x="105" y="260" text-anchor="middle" class="sym" fill="#1f2328" font-family="IBM Plex Mono, Consolas, monospace">∇B deposits</text>
    <text x="105" y="286" text-anchor="middle" class="sub" fill="#5f6b76">keyed (mb, block)</text>
    <text x="105" y="304" text-anchor="middle" class="sub" fill="#5f6b76">shared by the rank's stages</text>
    <text x="105" y="348" text-anchor="middle" class="note" fill="#1f6fb2" font-size="11.5">one per rank</text>

    <line x1="190" y1="212" x2="248" y2="212" class="fwd" fill="none" stroke="#1f2328" stroke-width="1.8" marker-end="url(#mf)"/>
    <text x="220" y="203" text-anchor="middle" class="lf" fill="#d9760a" font-family="IBM Plex Mono, Consolas, monospace">held B</text>
    <line x1="250" y1="238" x2="192" y2="238" class="fwd" fill="none" stroke="#1f2328" stroke-width="1.8" marker-end="url(#mf)"/>
    <text x="220" y="254" text-anchor="middle" class="lf" fill="#d9760a" font-family="IBM Plex Mono, Consolas, monospace">cache Δ</text>
    <polyline points="250,330 220,330 220,300 192,300" class="fwd" fill="none" stroke="#1f2328" stroke-width="1.8" marker-end="url(#mf)"/>
    <text x="222" y="348" text-anchor="middle" class="lf" fill="#d9760a" font-family="IBM Plex Mono, Consolas, monospace">commit B</text>

    <!-- backward column -->
    <rect x="570" y="530" width="230" height="40" rx="8" class="commh" fill="url(#hatch)" stroke="#2f9e44" stroke-width="1.4"/>
    <text x="685" y="555" text-anchor="middle" class="t" fill="#1f2328" font-size="13" font-weight="600">P2P recv</text>

    <rect x="570" y="420" width="230" height="50" rx="8" class="ent" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
    <text x="685" y="441" text-anchor="middle" class="t" fill="#1f2328" font-size="13" font-weight="600">collect</text>
    <text x="685" y="459" text-anchor="middle" class="sym" fill="#1f2328" font-family="IBM Plex Mono, Consolas, monospace">∇Δ′ += deposits</text>

    <rect x="570" y="190" width="230" height="50" rx="8" class="ent" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
    <text x="685" y="211" text-anchor="middle" class="t" fill="#1f2328" font-size="13" font-weight="600">split ∇B</text>
    <text x="685" y="229" text-anchor="middle" class="sym" fill="#1f2328" font-family="IBM Plex Mono, Consolas, monospace">Δ → wire, held → deposit</text>

    <rect x="570" y="90" width="230" height="40" rx="8" class="commh" fill="url(#hatch)" stroke="#2f9e44" stroke-width="1.4"/>
    <text x="685" y="115" text-anchor="middle" class="t" fill="#1f2328" font-size="13" font-weight="600">P2P send</text>

    <text x="570" y="684" class="cap b" fill="#d92d20" font-size="12.5" font-weight="600" letter-spacing="0.08em">BACKWARD</text>

    <line x1="685" y1="530" x2="685" y2="472" class="bwd" fill="none" stroke="#d92d20" stroke-width="1.8" marker-end="url(#mb)"/>
    <text x="693" y="506" class="lb" fill="#d92d20" font-family="IBM Plex Mono, Consolas, monospace">∇h′, ∇Δ′</text>
    <line x1="570" y1="445" x2="482" y2="352" class="bwd" fill="none" stroke="#d92d20" stroke-width="1.8" marker-end="url(#mb)"/>
    <text x="486" y="445" class="lb" fill="#d92d20" font-family="IBM Plex Mono, Consolas, monospace">backward</text>
    <line x1="480" y1="312" x2="568" y2="220" class="bwd" fill="none" stroke="#d92d20" stroke-width="1.8" marker-end="url(#mb)"/>
    <text x="522" y="292" class="lb" fill="#d92d20" font-family="IBM Plex Mono, Consolas, monospace">∇h, ∇B</text>
    <line x1="685" y1="190" x2="685" y2="132" class="bwd" fill="none" stroke="#d92d20" stroke-width="1.8" marker-end="url(#mb)"/>
    <text x="693" y="164" class="lb" fill="#d92d20" font-family="IBM Plex Mono, Consolas, monospace">∇h, ∇Δ</text>

    <!-- store <-> backward column -->
    <polyline points="570,200 525,200 525,160 105,160 105,188" class="bwd" fill="none" stroke="#d92d20" stroke-width="1.8" marker-end="url(#mb)"/>
    <text x="533" y="150" class="lb" fill="#d92d20" font-family="IBM Plex Mono, Consolas, monospace">deposit ∇B</text>
    <polyline points="105,330 105,496 610,496 610,472" class="bwd" fill="none" stroke="#d92d20" stroke-width="1.8" marker-end="url(#mb)"/>
    <text x="112" y="490" class="lb" fill="#d92d20" font-family="IBM Plex Mono, Consolas, monospace">deposits</text>

    <!-- notes -->
    <text x="820" y="215" class="note" fill="#1f6fb2" font-size="11.5">tables: the same on</text>
    <text x="820" y="231" class="note" fill="#1f6fb2" font-size="11.5">every rank, no collective</text>
    <text x="820" y="330" class="note" fill="#1f6fb2" font-size="11.5">last stage: aggregation</text>
    <text x="820" y="346" class="note" fill="#1f6fb2" font-size="11.5">on (h, B), no send</text>

    <line x1="975" y1="20" x2="975" y2="690" stroke="#d9d4c7" stroke-dasharray="4 6"/>

    <!-- ===================== cache off ===================== -->
    <text x="1000" y="30" class="title" fill="#1f2328" font-size="15" font-weight="600">attn_res_cache off</text>
    <text x="1160" y="30" class="sub" fill="#5f6b76">the whole stack every hop</text>

    <text x="1155" y="72" text-anchor="middle" class="lf" fill="#d9760a" font-family="IBM Plex Mono, Consolas, monospace">h, B  from stage s−1</text>
    <text x="1155" y="604" text-anchor="middle" class="lf" fill="#d9760a" font-family="IBM Plex Mono, Consolas, monospace">h′, B′  to stage s+1</text>
    <text x="1375" y="72" text-anchor="middle" class="lb" fill="#d92d20" font-family="IBM Plex Mono, Consolas, monospace">∇h, ∇B  to stage s−1</text>
    <text x="1375" y="604" text-anchor="middle" class="lb" fill="#d92d20" font-family="IBM Plex Mono, Consolas, monospace">∇h′, ∇B′  from stage s+1</text>

    <rect x="1040" y="90" width="230" height="40" rx="8" class="comm" fill="#c6efce" stroke="#2f9e44" stroke-width="1.4"/>
    <text x="1155" y="115" text-anchor="middle" class="t" fill="#1f2328" font-size="13" font-weight="600">P2P recv</text>
    <rect x="1040" y="300" width="230" height="60" rx="8" class="ent" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
    <text x="1155" y="325" text-anchor="middle" class="t" fill="#1f2328" font-size="13" font-weight="600">layers l..m</text>
    <text x="1155" y="345" text-anchor="middle" class="sym" fill="#1f2328" font-family="IBM Plex Mono, Consolas, monospace">B is the leaf</text>
    <rect x="1040" y="530" width="230" height="40" rx="8" class="comm" fill="#c6efce" stroke="#2f9e44" stroke-width="1.4"/>
    <text x="1155" y="555" text-anchor="middle" class="t" fill="#1f2328" font-size="13" font-weight="600">P2P send</text>
    <text x="1040" y="684" class="cap f" fill="#d9760a" font-size="12.5" font-weight="600" letter-spacing="0.08em">FORWARD</text>

    <line x1="1155" y1="130" x2="1155" y2="298" class="fwd" fill="none" stroke="#1f2328" stroke-width="1.8" marker-end="url(#mf)"/>
    <text x="1163" y="220" class="lf" fill="#d9760a" font-family="IBM Plex Mono, Consolas, monospace">h, B</text>
    <line x1="1155" y1="360" x2="1155" y2="528" class="fwd" fill="none" stroke="#1f2328" stroke-width="1.8" marker-end="url(#mf)"/>
    <text x="1163" y="450" class="lf" fill="#d9760a" font-family="IBM Plex Mono, Consolas, monospace">h′, B′</text>

    <rect x="1300" y="530" width="150" height="40" rx="8" class="commh" fill="url(#hatch)" stroke="#2f9e44" stroke-width="1.4"/>
    <text x="1375" y="555" text-anchor="middle" class="t" fill="#1f2328" font-size="13" font-weight="600">P2P recv</text>
    <rect x="1300" y="90" width="150" height="40" rx="8" class="commh" fill="url(#hatch)" stroke="#2f9e44" stroke-width="1.4"/>
    <text x="1375" y="115" text-anchor="middle" class="t" fill="#1f2328" font-size="13" font-weight="600">P2P send</text>
    <text x="1300" y="684" class="cap b" fill="#d92d20" font-size="12.5" font-weight="600" letter-spacing="0.08em">BACKWARD</text>

    <polyline points="1375,530 1375,345 1272,345" class="bwd" fill="none" stroke="#d92d20" stroke-width="1.8" marker-end="url(#mb)"/>
    <text x="1383" y="445" class="lb" fill="#d92d20" font-family="IBM Plex Mono, Consolas, monospace">∇h′, ∇B′</text>
    <polyline points="1270,315 1335,315 1335,132" class="bwd" fill="none" stroke="#d92d20" stroke-width="1.8" marker-end="url(#mb)"/>
    <text x="1343" y="225" class="lb" fill="#d92d20" font-family="IBM Plex Mono, Consolas, monospace">∇h, ∇B</text>

    <text x="1040" y="630" class="note" fill="#1f6fb2" font-size="11.5">no store, no deposits;</text>
    <text x="1040" y="646" class="note" fill="#1f6fb2" font-size="11.5">B grows with the stage index</text>
  </svg>
