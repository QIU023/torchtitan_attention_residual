<text class="s" x="30" y="84">rank r: tokens chunk r, all H heads</text>
<text class="t" x="325" y="70" text-anchor="middle" font-weight="700">2. All-to-All</text>
<text class="s" x="325" y="84" text-anchor="middle">seq -&gt; heads</text>
<text class="t" x="460" y="70" font-weight="700">3. head-sharded: full-sequence MLA</text>
<text class="s" x="460" y="84">rank r: all T tokens, heads band r</text>
