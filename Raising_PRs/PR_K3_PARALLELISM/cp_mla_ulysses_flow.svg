<text class="s" x="30" y="404">seq -&gt;</text>
<text class="s" x="148" y="404">heads v</text>
<text class="s" x="20" y="422">per rank: [L, H, W] -&gt; [T, G, W] -&gt; attention with a causal mask over T -&gt; [T, G, V] -&gt; [L, H, V], with L = T/cp, G = H/cp, W = Q+N+V.</text>
<text class="s" x="20" y="438">the rotary key (one vector per token, no head dim) is all-gathered along the sequence instead of exchanged. every collective is differentiable; the backward is the transposed one.</text>
