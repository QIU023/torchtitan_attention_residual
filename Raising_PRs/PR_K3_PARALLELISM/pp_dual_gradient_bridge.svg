<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-label="Two gradient channels for one AttnRes block under pipeline parallelism">
      <style>
  text{font-family:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;fill:#0e1626}
  .t{font-size:11.5px}.s{font-size:10px;fill:#4b5a70}.b{font-size:12.5px;font-weight:700}
</style>
<rect width="1080" height="540" fill="#ffffff"/>
      <defs>
        <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#2547d0"/></marker>
        <marker id="am" markerWidth="10" markerHeight="10" refX="8" refY="3.4" orient="auto"><path d="M0,0 L8,3.4 L0,6.8 Z" fill="#a81e7a"/></marker>
        <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#0f7b5f"/></marker>
        <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#9a6100"/></marker>
      </defs>

      <text class="b" x="20" y="22">Forward: where block b (committed by stage S_p, rank R_p) is read from</text>

      <!-- stage boxes -->
      <g>
        <rect x="20" y="62" width="118" height="48" rx="4" fill="#2547d0"/>
        <text class="t" x="79" y="82" text-anchor="middle" fill="#fff">S_p</text>
        <text class="s" x="79" y="99" text-anchor="middle" fill="#dfe4ec">commits b</text>

        <rect x="170" y="62" width="112" height="48" rx="4" fill="#eef1f8" stroke="#2547d0" stroke-width="1.4"/>
        <text class="t" x="226" y="82" text-anchor="middle">S_p+1</text>
        <text class="s" x="226" y="99" text-anchor="middle">fresh recv</text>

        <text class="t" x="312" y="90" text-anchor="middle">...</text>

        <rect x="340" y="62" width="124" height="48" rx="4" fill="#eef1f8" stroke="#2547d0" stroke-width="1.4"/>
        <text class="t" x="402" y="82" text-anchor="middle">S_p+P-1</text>
        <text class="s" x="402" y="99" text-anchor="middle">fresh recv</text>

        <rect x="496" y="62" width="124" height="48" rx="4" fill="#fbeff6" stroke="#a81e7a" stroke-width="2"/>
        <text class="t" x="558" y="82" text-anchor="middle" fill="#a81e7a">S_p+P</text>
        <text class="s" x="558" y="99" text-anchor="middle" fill="#a81e7a">same rank: cache</text>

        <rect x="652" y="62" width="124" height="48" rx="4" fill="#fdf4e7" stroke="#9a6100" stroke-width="1.4"/>
        <text class="t" x="714" y="82" text-anchor="middle" fill="#9a6100">S_p+P+1</text>
        <text class="s" x="714" y="99" text-anchor="middle" fill="#9a6100">other rank: relay</text>

        <text class="t" x="806" y="90" text-anchor="middle">...</text>

        <rect x="836" y="62" width="124" height="48" rx="4" fill="#fbeff6" stroke="#a81e7a" stroke-width="2"/>
        <text class="t" x="898" y="82" text-anchor="middle" fill="#a81e7a">S_p+2P</text>
        <text class="s" x="898" y="99" text-anchor="middle" fill="#a81e7a">same rank: cache</text>

        <text class="t" x="990" y="90" text-anchor="middle">...</text>
        <rect x="1008" y="62" width="56" height="48" rx="4" fill="#eef1f8" stroke="#2547d0" stroke-width="1.4"/>
        <text class="t" x="1036" y="90" text-anchor="middle">T-1</text>
      </g>

      <!-- forward P2P arrows over the delta window -->
      <g stroke="#2547d0" stroke-width="2" fill="none" marker-end="url(#ab)">
        <path d="M138,54 C154,36 166,36 182,54"/>
        <path d="M282,54 C296,38 304,38 318,52"/>
        <path d="M330,52 C342,38 352,38 366,54"/>
      </g>
      <rect x="20" y="118" width="444" height="22" rx="11" fill="#2547d0" opacity=".1" stroke="#2547d0" stroke-dasharray="5 3"/>
      <text class="s" x="242" y="133" text-anchor="middle" fill="#2547d0">delta window: b rides the P2P for P-1 hops only</text>
      <text class="s" x="760" y="133" text-anchor="middle" fill="#9a6100">from S_p+P on, every rank already holds b in its cache</text>

      <!-- backward -->
      <text class="b" x="20" y="186">Backward: how every consumer's gradient for b reaches S_p</text>

      <!-- channel A chain along the axis -->
      <path d="M1008,214 L142,214" stroke="#a81e7a" stroke-width="2.4" fill="none" marker-end="url(#am)"/>
      <g stroke="#a81e7a" stroke-width="2.4" fill="none" marker-end="url(#am)">
        <path d="M1036,206 L1036,214"/>
        <path d="M714,206 L714,214"/>
        <path d="M402,206 L402,214"/>
        <path d="M226,206 L226,214"/>
      </g>
      <text class="s" x="570" y="236" text-anchor="middle" fill="#a81e7a">channel A: SEND_B walks the recv chain hop by hop; each stage's own contribution merges into it on the way (recv-originated and relayed blocks stay autograd-attached)</text>

      <!-- channel B: same-rank consumers to the slot -->
      <g stroke="#0f7b5f" stroke-width="2" fill="none" marker-end="url(#ag)">
        <path d="M558,206 L558,262"/>
        <path d="M898,206 L898,262"/>
      </g>
      <rect x="380" y="266" width="640" height="46" rx="5" fill="#fff" stroke="#0f7b5f" stroke-width="1.6"/>
      <text class="t" x="700" y="285" text-anchor="middle" fill="#0f7b5f" font-weight="700">rank-local slot, key = (micro-batch, S_p, commit index)</text>
      <text class="s" x="700" y="303" text-anchor="middle" fill="#0f7b5f">the cache holds b DETACHED; _LocalCacheCapture.backward deposits here and stops; no collective</text>
      <path d="M380,289 C250,289 180,250 142,230" stroke="#0f7b5f" stroke-width="2.2" fill="none" marker-end="url(#ag)"/>
      <text class="s" x="236" y="262" fill="#0f7b5f">pop and add, inside S_p's own backward</text>

      <!-- producer sum -->
      <rect x="20" y="340" width="1044" height="64" rx="5" fill="#eef1f8" stroke="#0e1626" stroke-width="1.4"/>
      <text class="t" x="36" y="362" font-weight="700">At S_p, the grad hook on the attached block (_install_augment_hook):</text>
      <text class="t" x="36" y="386"><tspan fill="#a81e7a">grad arriving on channel A</tspan>  +  <tspan fill="#0f7b5f">sum of the slot deposits (channel B)</tspan>  =  the block's full gradient, then S_p's forward graph is traversed exactly once</text>

      <!-- counts -->
      <rect x="20" y="424" width="512" height="96" rx="5" fill="#fff" stroke="#c6cdd9"/>
      <text class="t" x="36" y="446" font-weight="700">Counts for a block from S_p, v_p = S_p div P</text>
      <text class="t" x="36" y="470">consumers in total          = T - 1 - S_p</text>
      <text class="t" x="36" y="490" fill="#0f7b5f">channel B (same rank)       = V - 1 - v_p</text>
      <text class="t" x="36" y="510" fill="#a81e7a">channel A (everything else) = (T - 1 - S_p) - (V - 1 - v_p)</text>

      <rect x="552" y="424" width="512" height="96" rx="5" fill="#fff" stroke="#c6cdd9"/>
      <text class="t" x="568" y="446" font-weight="700">Self-check</text>
      <text class="s" x="568" y="468">layout.expected_same_rank_captures(S_p, i) returns V - 1 - v_p offline.</text>
      <text class="s" x="568" y="486">The hook compares the deposits it pops against it and refuses the step</text>
      <text class="s" x="568" y="504">on a mismatch: a missing capture is a lost gradient no loss curve shows.</text>
    </svg>
